name: Build & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Pulse.sln

      - name: Build solution (Release / Mixed Platforms)
        run: |
          msbuild Pulse.sln `
            /p:Configuration=Release `
            /p:"Platform=Mixed Platforms" `
            /m

      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test Pulse.Tests\bin\Release\Pulse.Tests.dll `
            --test-adapter-path packages\MSTest.TestAdapter.3.6.0\build\net462 `
            --logger "console;verbosity=normal"

      - name: Collect release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $out = "release-artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item -Path "bin\Release\*" -Destination $out -Recurse
          Remove-Item -Force -Recurse (Join-Path $out "app.publish") -ErrorAction SilentlyContinue
          Get-ChildItem -Path $out -Filter "*.pdb" -Recurse | Remove-Item -Force

          Get-ChildItem $out | Select-Object Name, Length
          Get-ChildItem (Join-Path $out "Providers") | Select-Object Name, Length

      - name: Create ZIP archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "release-artifacts\*" -DestinationPath "Pulse-$tag.zip"

      - name: Upload Release Archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: pulse-release
          path: Pulse-${{ github.ref_name }}.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download Release Archive
        uses: actions/download-artifact@v4
        with:
          name: pulse-release
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "Pulse ${{ github.ref_name }}"
          body: |
            ## Pulse ${{ github.ref_name }}

            ### Installation
            1. Download and extract `Pulse-${{ github.ref_name }}.zip`
            2. Run `Pulse.exe`

            ### What Changed
            See the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for details.
          files: Pulse-${{ github.ref_name }}.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
